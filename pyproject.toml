[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psyche-engine"
version = "0.1.0"
description = "Bayesian persona engine: conjugate-update mixture model with raking, recency decay, and drift-bounded tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "psyche-engine contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]

[project.scripts]
psyche = "psyche.cli:main"

[tool.setuptools.packages.find]
include = ["psyche*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["SIM300"]  # pytest idiom: assert value == pytest.approx(...)

[tool.pytest.ini_options]
testpaths = ["tests"]
